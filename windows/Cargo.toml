[workspace]
resolver = "2"
members = [
    "crates/askkey-protocol",
    "crates/askkey-system",
    "crates/askkey-vault",
    "crates/askkey-broker",
    "crates/askkey-helper",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/WENGENG-boop/AskKey-Windows"

[workspace.dependencies]
askkey-protocol = { path = "crates/askkey-protocol" }
askkey-system = { path = "crates/askkey-system" }
askkey-vault = { path = "crates/askkey-vault" }
askkey-broker = { path = "crates/askkey-broker" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
hmac = "0.12"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
tempfile = "3"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
